[package]
name = "graff"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A code map for Claude Code"
license = "MIT"
repository = "https://github.com/thiagoproldan/graff"
readme = "README.md"
keywords = ["code-map", "claude-code", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "graff"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
